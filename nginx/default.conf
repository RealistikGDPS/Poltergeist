# Routes the public port: the control room lives under /panel, the game
# server takes everything else. Upstreams resolve lazily so either container
# may restart or be absent without taking the other down.
server {
    listen 80;
    server_name _;
    resolver 127.0.0.11 valid=10s;
    client_max_body_size 128m;

    location /panel/ {
        set $panel http://poltergeist-panel:8501;
        proxy_pass $panel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location = /panel {
        return 302 /panel/;
    }

    location / {
        set $app http://app:80;
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
